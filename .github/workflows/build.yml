name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # The routing engine is plain Kotlin/JVM, so it needs no Android SDK.
      - name: Run core tests
        run: ./gradlew :core:test -Pshadowgps.android=false

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test

  app:
    name: android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Google removed the obsolete "tools" package from the SDK repository, and this
      # action installs it by default, so the default now fails outright with "Failed to
      # find package 'tools'". The runner image already ships platform-tools and the
      # command-line tools; all this step still needs to do is accept the licences and
      # export ANDROID_HOME, which it does with nothing to install.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      # What actually ships, as opposed to what the source says. The manifest merger
      # rewrites relative class names, folds in library manifests and can drop entries
      # outright, and none of that is visible from the sources — which matters for the
      # Android Auto service, since a car app that is not in the merged manifest is
      # invisible to the host with no error anywhere to explain it.
      - name: Show merged manifest
        run: |
          set -eu
          manifest=$(find app/build/intermediates -name AndroidManifest.xml -path '*debug*'             -not -path '*aapt*' -not -path '*navigation*' | head -1)
          echo "--- $manifest"
          cat "$manifest"

      # A car service that silently failed to merge would look exactly like Android Auto
      # refusing to list the app, and the two want completely different fixes. Reading the
      # dump above by eye is how that distinction gets lost, so assert it instead.
      - name: Check the car services survived the merge
        run: |
          set -eu
          manifest=$(find app/build/intermediates -name AndroidManifest.xml -path '*debug*'             -not -path '*aapt*' -not -path '*navigation*' | head -1)
          missing=0
          for entry in \
            "dev.shadowgps.app.car.ShadowCarAppService" \
            "dev.shadowgps.app.car.PoiProbeCarAppService" \
            "androidx.car.app.CarAppService" \
            "androidx.car.app.category.NAVIGATION" \
            "androidx.car.app.category.POI" \
            "androidx.car.app.minCarApiLevel" \
            "com.google.android.gms.car.application"
          do
            if grep -q -- "$entry" "$manifest"; then
              echo "ok      $entry"
            else
              echo "MISSING $entry"
              missing=1
            fi
          done
          exit "$missing"

      - name: Lint
        run: ./gradlew :app:lintDebug

      # Gradle only echoes the first lint failure, which makes a run with several of
      # them a guessing game.
      - name: Show full lint report
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: shadowgps-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
